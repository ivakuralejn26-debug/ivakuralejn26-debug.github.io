<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДОСЬЕ // Архив</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=PT+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0A0A0B;
  --panel:#131315;
  --line:#3A2A10;
  --paper:#D9C8A0;
  --red:#FF6633;
  --red-dim:#803318;
  --dim:#8A7A50;
  --amber:#FFB000;
  --amber-glow:rgba(255,176,0,0.6);
  --amber-dim:#CC8800;
  --screen-bg:#0A0800;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:#111;
  color:var(--paper);
  font-family:'PT Serif', Georgia, serif;
  line-height:1.6;
  min-height:100vh;
  padding:24px;
  overflow:auto;
}
.term{
  font-family:'VT323', 'Share Tech Mono', monospace;
  font-size:20px;
  letter-spacing:0.04em;
  color:var(--amber);
  text-shadow:0 0 4px var(--amber-glow), 0 0 12px rgba(255,140,0,0.3);
}

/* ── CRT MONITOR BEZEL ── */
.crt-monitor{
  position:relative;
  background:#1a1a1a;
  border-radius:20px;
  padding:28px 32px 48px;
  box-shadow:
    0 0 0 2px #222,
    0 0 0 4px #111,
    0 8px 40px rgba(0,0,0,0.8),
    inset 0 1px 0 rgba(255,255,255,0.04);
  max-width:860px;
  width:100%;
  margin:0 auto;
}
.power-led{
  position:absolute; bottom:16px; left:32px;
  width:8px; height:8px; border-radius:50%;
  background:#FF6600;
  box-shadow:0 0 6px #FF6600, 0 0 14px rgba(255,102,0,0.5);
  animation: led-pulse 3s ease-in-out infinite;
}
@keyframes led-pulse{
  0%,100%{opacity:1; box-shadow:0 0 6px #FF6600, 0 0 14px rgba(255,102,0,0.5);}
  50%{opacity:0.7; box-shadow:0 0 4px #FF6600, 0 0 8px rgba(255,102,0,0.3);}
}

/* ── SCREEN ── */
.crt-screen{
  position:relative;
  background:var(--screen-bg);
  border-radius:12px;
  overflow:hidden;
  animation:power-on 1.2s ease-out;
}
.crt-screen::before{
  content:""; position:absolute; inset:0;
  pointer-events:none; z-index:10;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 1px,
    transparent 1px, transparent 2px
  );
}
.crt-screen::after{
  content:""; position:absolute; inset:0;
  pointer-events:none; z-index:11;
  box-shadow:inset 0 0 100px rgba(0,0,0,0.6), inset 0 0 200px rgba(0,0,0,0.3);
  border-radius:12px;
}
@keyframes flicker{
  0%,100%{opacity:1;} 92%{opacity:1;} 93%{opacity:0.88;}
  94%{opacity:1;} 96%{opacity:0.93;} 97%{opacity:1;}
}
@keyframes power-on{
  0%{transform:scaleY(0.005) scaleX(0.2); filter:brightness(10);}
  20%{transform:scaleY(0.005) scaleX(0.9); filter:brightness(6);}
  40%{transform:scaleY(0.005) scaleX(1); filter:brightness(4);}
  60%{transform:scaleY(1) scaleX(1); filter:brightness(2);}
  100%{transform:scaleY(1) scaleX(1); filter:brightness(1);}
}
@keyframes switch-glitch{
  0%{opacity:0; transform:translateX(-6px) skewX(4deg); filter:brightness(3);}
  30%{opacity:0.7; transform:translateX(4px) skewX(-2deg); filter:brightness(1.8);}
  55%{opacity:0.4; transform:translateX(-2px); filter:brightness(2.4);}
  100%{opacity:1; transform:none; filter:brightness(1);}
}
#dossier.switching{animation:switch-glitch 0.35s ease-out;}

/* ── CONTENT ── */
.sheet{padding:40px 32px 56px; animation:flicker 4s infinite;}
.stamp-row{
  display:flex; justify-content:space-between; align-items:flex-start;
  border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:24px;
  font-size:12px; color:var(--dim);
}
.stamp-row .id{color:var(--red); text-shadow:0 0 4px rgba(255,102,51,0.4);}

/* ── ROSTER ── */
.roster{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:32px;}
.roster a{
  font-size:16px; padding:2px 12px; color:var(--dim);
  border:1px solid var(--line); text-decoration:none;
}
.roster a:hover{color:var(--amber); border-color:var(--amber-dim);}
.roster a.active{background:var(--amber); color:var(--screen-bg); text-shadow:none;}

/* ── PROFILE: фото + шапка ── */
.profile{
  display:grid; grid-template-columns:200px 1fr; gap:28px;
  align-items:start; margin-bottom:44px;
}
.photo{
  border:1px solid var(--line); aspect-ratio:3/4;
  background:#0e0b03; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.photo img{
  width:100%; height:100%; object-fit:cover; display:block;
  filter:sepia(0.55) saturate(1.2) contrast(1.05) brightness(0.9);
}
.photo.empty span{font-size:16px; color:var(--dim); text-shadow:none; text-align:center;}

.title-block{margin-bottom:28px;}
.title-block .over{
  font-size:12px; color:var(--red); margin-bottom:10px;
  text-shadow:0 0 4px rgba(255,102,51,0.4);
}
.title-block h1{
  font-size:48px; line-height:1.1; font-weight:400; letter-spacing:-0.01em;
  font-style:italic; color:var(--paper); overflow-wrap:anywhere;
}
.field-grid{border:1px solid var(--line);}
.frow{display:grid; grid-template-columns:140px 1fr; border-bottom:1px solid var(--line);}
.frow:last-child{border-bottom:none;}
.frow .k{
  padding:12px 16px; font-size:11px; color:var(--amber-dim);
  border-right:1px solid var(--line); display:flex; align-items:center;
  text-shadow:0 0 3px rgba(204,136,0,0.3);
}
.frow .v{padding:12px 16px; font-size:17px;}
.status-alive{color:#8CA87C; text-shadow:0 0 4px rgba(140,168,124,0.4);}
.status-dead{color:var(--red); text-shadow:0 0 4px rgba(255,102,51,0.4);}

section{margin-bottom:44px;}
.sec-head{
  font-size:12px; color:var(--red); margin-bottom:14px;
  display:flex; align-items:center; gap:10px;
  text-shadow:0 0 4px rgba(255,102,51,0.4);
}
.sec-head::after{content:""; flex:1; height:1px; background:var(--line);}
.body-text{font-size:18px; color:var(--paper); max-width:640px; margin-bottom:12px;}
.body-text.placeholder{color:var(--dim); font-style:italic;}

.msg{font-size:18px; color:var(--dim); padding:24px 0;}

footer{
  border-top:1px solid var(--line); padding-top:20px;
  font-size:11px; color:var(--dim); display:flex; justify-content:space-between;
}
@media(max-width:560px){
  .crt-monitor{padding:16px 16px 40px; border-radius:12px;}
  .sheet{padding:24px 16px 32px;}
  .profile{grid-template-columns:1fr; gap:20px;}
  .photo{max-width:200px;}
  .title-block h1{font-size:36px;}
  .frow{grid-template-columns:110px 1fr;}
}
</style>
</head>
<body>

<div class="crt-monitor">
  <div class="crt-screen">
    <div class="sheet">

      <div class="stamp-row term">
        <span>ARCHIVE ACCESS · RESTRICTED</span>
        <span class="id" id="rec-id"></span>
      </div>

      <nav class="roster term" id="roster"></nav>

      <div id="dossier"></div>

      <footer class="term">
        <span></span>
      </footer>

    </div>
  </div>
  <div class="power-led"></div>
</div>

<script>
const BASE = 'characters/';

const roster  = document.getElementById('roster');
const dossier = document.getElementById('dossier');
const recId   = document.getElementById('rec-id');

let list = []; // [{ slug, data }]

// защита от вставки HTML из анкет
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]
));
// переносы строк в тексте -> отдельные абзацы
const paragraphs = (text, cls) =>
  esc(text).split(/\n+/).map(p => `<p class="body-text${cls}">${p}</p>`).join('');

async function loadJSON(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(url + ' → ' + r.status);
  return r.json();
}

async function init() {
  try {
    const slugs = (await loadJSON(BASE + 'index.json'))
      .filter(s => /^[\w-]+$/.test(s));

    const results = await Promise.allSettled(
      slugs.map(slug => loadJSON(`${BASE}${slug}/data.json`).then(data => ({ slug, data })))
    );
    results.forEach((r, i) => {
      if (r.status === 'fulfilled') list.push(r.value);
      else console.warn('Не загрузилась анкета:', slugs[i], r.reason);
    });
  } catch (e) {
    console.error(e);
  }

  if (!list.length) {
    dossier.innerHTML = '<p class="msg term">// АРХИВ ПУСТ ИЛИ НЕДОСТУПЕН</p>';
    return;
  }

  roster.innerHTML = list
    .map(({ slug, data }) => `<a href="#${esc(slug)}" data-slug="${esc(slug)}">${esc(data.name)}</a>`)
    .join('');

  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
}

function show(slug) {
  const entry = list.find(x => x.slug === slug) || list[0];
  const { data: c } = entry;

  recId.textContent = c.id || '';
  roster.querySelectorAll('a').forEach(a =>
    a.classList.toggle('active', a.dataset.slug === entry.slug));

  const rows = [
    `<div class="frow">
       <div class="k term">СТАТУС</div>
       <div class="v ${c.alive ? 'status-alive' : 'status-dead'}">${esc(c.status)}</div>
     </div>`,
    ...(c.fields || []).map(([k, v]) =>
      `<div class="frow"><div class="k term">${esc(k)}</div><div class="v">${esc(v)}</div></div>`)
  ].join('');

  const sections = (c.sections || []).map(s => `
    <section>
      <div class="sec-head term">${esc(s.title)}</div>
      ${paragraphs(s.text, s.placeholder ? ' placeholder' : '')}
    </section>`).join('');

  dossier.innerHTML = `
    <div class="profile">
      <div class="photo empty" id="photo"><span class="term">[ Фото отсутствует ]</span></div>
      <div>
        <div class="title-block">
          <div class="over term">// ДОСЬЕ</div>
          <h1>${esc(c.name)}</h1>
        </div>
        <div class="field-grid">${rows}</div>
      </div>
    </div>
    ${sections}`;

  // фото: если файл указан и грузится — подменяем заглушку
  if (c.photo) {
    const img = new Image();
    const box = document.getElementById('photo'); // именно этот блок, а не будущий
    img.alt = c.name || '';
    img.onload = () => {
      box.classList.remove('empty');
      box.replaceChildren(img);
    };
    img.src = `${BASE}${entry.slug}/${encodeURIComponent(c.photo)}`;
  }

  // глитч при смене досье
  dossier.classList.remove('switching');
  void dossier.offsetWidth;
  dossier.classList.add('switching');
}

init();
</script>

</body>
</html>
